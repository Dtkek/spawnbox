# Сборка для Windows: приложение и установщик SpawnboxSetup.exe, Python не нужен.
# Собирается на каждый push в main и обновляет релиз с тегом latest.
# Данные приложения живут в %LOCALAPPDATA%\Spawnbox, см. app/spawnbox/config.py.
name: Сборка для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      APP_VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Тесты на заглушке сервера
        run: python app/tests/test_spawnbox.py

      - name: PyInstaller
        shell: pwsh
        run: |
          Set-Content -NoNewline -Encoding ascii app/spawnbox/static/version.txt $env:APP_VERSION
          python -m pip install pyinstaller pillow -r app/requirements-desktop.txt
          pyinstaller --noconfirm --clean --onedir --windowed --name spawnbox --icon app/spawnbox/static/icon.ico --paths app --add-data "app/spawnbox/static;spawnbox/static" --hidden-import pystray._win32 app/app.py
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller не собрал приложение" }

      - name: Установщик
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyVersion=$env:APP_VERSION" app/packaging/spawnbox.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup не собрал установщик" }

      - name: WebView2
        # На раннере его может не быть, а проверить нужно настоящее окно
        shell: pwsh
        run: |
          Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile "$env:RUNNER_TEMP\webview2.exe"
          Start-Process "$env:RUNNER_TEMP\webview2.exe" -ArgumentList "/silent", "/install" -Wait

      - name: Проверка приложения
        # Как у пользователя с русским именем: кириллица в пути к программе и к профилю,
        # а данные должны уйти в общую папку. Настоящие ядра доходят до требования EULA,
        # сама EULA не принимается
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "Рабочий стол"
          $env:LOCALAPPDATA = Join-Path $root "Данные"
          $env:SMOKE_SHOTS = Join-Path $env:RUNNER_TEMP "shots"
          New-Item -ItemType Directory -Force $env:LOCALAPPDATA, $env:SMOKE_SHOTS | Out-Null
          python app/tests/smoke_windows.py dist\SpawnboxSetup.exe (Join-Path $root "Программа")
          if ($LASTEXITCODE -ne 0) { throw "Проверка приложения не прошла" }

      - name: Снимки окна
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: shots
          path: ${{ runner.temp }}/shots
          if-no-files-found: warn

      - name: Передвинуть тег latest
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Релиз latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            Автоматическая сборка из main (${{ github.sha }}), версия ${{ env.APP_VERSION }}.
            Скачай `SpawnboxSetup.exe` и запусти его. Python и права администратора не нужны.
            Обновление: запусти новый установщик поверх старого, миры останутся.
            Данные (миры, бэкапы, Java) лежат в `%LOCALAPPDATA%\Spawnbox`.
          files: dist/SpawnboxSetup.exe
