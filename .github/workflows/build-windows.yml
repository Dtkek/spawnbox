# Сборка для Windows: один файл spawnbox.exe, Python и распаковка не нужны.
# Собирается на каждый push в main и обновляет релиз с тегом latest.
# Данные exe живут в %LOCALAPPDATA%\Spawnbox, см. app/spawnbox/config.py.
name: Сборка для Windows

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Тесты на заглушке сервера
        run: python app/tests/test_spawnbox.py

      - name: PyInstaller
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --name spawnbox --paths app --add-data "app/spawnbox/static;spawnbox/static" app/app.py

      - name: Проверка exe
        # Запуск как у пользователя: из папки с кириллицей в пути. Настоящие Paper и Forge
        # доходят до требования EULA, сама EULA не принимается
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP "Рабочий стол"
          New-Item -ItemType Directory -Force $dir | Out-Null
          $exe = Join-Path $dir "spawnbox.exe"
          Copy-Item dist\spawnbox.exe $exe
          python app/tests/smoke_windows.py $exe
          if ($LASTEXITCODE -ne 0) { throw "Проверка exe не прошла" }

      - name: Передвинуть тег latest
        if: github.ref == 'refs/heads/main'
        run: |
          git tag -f latest
          git push -f origin latest

      - name: Релиз latest
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Последняя сборка
          body: |
            Автоматическая сборка из main (${{ github.sha }}).
            Скачай `spawnbox.exe` и запусти его: Python и распаковка не нужны.
            Данные (миры, бэкапы, Java) лежат в `%LOCALAPPDATA%\Spawnbox`.
          files: dist/spawnbox.exe
